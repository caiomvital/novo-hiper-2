services:
  novo-hiper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novo-hiper-app
    restart: unless-stopped
    ports:
      # Permite definir porta externa customizada na VPS (ex: APP_PORT=3001) para evitar conflitos
      - "127.0.0.1:${APP_PORT:-8504}:3000"
    volumes:
      # Volume persistente para o banco SQLite (o banco não é descartado quando o container for recriado)
      - ./data:/app/data
      # Volume persistente para os arquivos de fotos das plantas
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DATA_DIR=${DATA_DIR:-/app/data}
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/novo-hiper.db}
      - UPLOADS_DIR=${UPLOADS_DIR:-/app/uploads}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - AUTH_USERNAME=${AUTH_USERNAME:-Bernardo}
      - AUTH_PASSWORD_HASH=${AUTH_PASSWORD_HASH:-}
      - SESSION_TTL_DAYS=${SESSION_TTL_DAYS:-30}
      # Importação legada do localStorage: DESATIVADA por padrão em produção (ver docs/AUTH_AND_SESSIONS.md)
      - ENABLE_LEGACY_MIGRATION=${ENABLE_LEGACY_MIGRATION:-false}
    networks:
      - novo-hiper-net

networks:
  novo-hiper-net:
    driver: bridge
