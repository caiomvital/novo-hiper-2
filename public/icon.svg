<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#044e3b" />
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with subtle rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Decorative circles / sunshine glow in background -->
  <circle cx="256" cy="220" r="140" fill="#10b981" opacity="0.12" />
  <circle cx="256" cy="220" r="100" fill="#34d399" opacity="0.15" />

  <!-- Main Plant Group with Filter -->
  <g filter="url(#shadow)">
    <!-- Stem -->
    <path d="M256 340 C256 260 256 200 256 160" stroke="#059669" stroke-width="18" stroke-linecap="round" />

    <!-- Left Large Leaf -->
    <path d="M256 270 C200 270 140 230 150 160 C210 160 250 210 256 270 Z" fill="url(#leafGrad1)" />
    <!-- Left Leaf Vein -->
    <path d="M256 270 C215 235 185 200 165 175" stroke="#047857" stroke-width="4" stroke-linecap="round" opacity="0.4" />

    <!-- Right Large Leaf -->
    <path d="M256 230 C310 230 370 190 360 120 C300 120 260 170 256 230 Z" fill="url(#leafGrad2)" />
    <!-- Right Leaf Vein -->
    <path d="M256 230 C295 195 325 160 345 135" stroke="#059669" stroke-width="4" stroke-linecap="round" opacity="0.4" />

    <!-- Top Sprout Leaves -->
    <path d="M256 165 C240 135 240 100 256 80 C272 100 272 135 256 165 Z" fill="#6ee7b7" />
    <circle cx="256" cy="80" r="9" fill="#fde047" />

    <!-- Golden Sparkles -->
    <path d="M360 90 L365 105 L380 110 L365 115 L360 130 L355 115 L340 110 L355 105 Z" fill="#fde047" />
    <path d="M140 130 L143 140 L153 143 L143 146 L140 156 L137 146 L127 143 L137 140 Z" fill="#fef08a" opacity="0.9" />

    <!-- Plant Pot Rim -->
    <rect x="186" y="320" width="140" height="26" rx="13" fill="#fb923c" />
    <!-- Plant Pot Body -->
    <path d="M198 344 L212 425 C214 436 223 444 234 444 L278 444 C289 444 298 436 300 425 L314 344 Z" fill="url(#potGrad)" />
    
    <!-- Heart Badge on Pot -->
    <path d="M256 395 C256 395 240 382 240 372 C240 365 245 360 251 360 C254 360 256 362 256 362 C256 362 258 360 261 360 C267 360 272 365 272 372 C272 382 256 395 256 395 Z" fill="#fef08a" />
  </g>

  <!-- Happy Face on Pot (Playful/Child-Friendly) -->
  <circle cx="238" cy="386" r="3.5" fill="#7c2d12" />
  <circle cx="274" cy="386" r="3.5" fill="#7c2d12" />
  <path d="M250 395 Q256 401 262 395" stroke="#7c2d12" stroke-width="3" stroke-linecap="round" fill="none" />
</svg>
